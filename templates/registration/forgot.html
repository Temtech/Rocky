{% extends 'base.html' %}{% load static %}{% block content %}<img class="auth-logo" src="{% static 'logo.svg' %}" alt="Rocky’s"><section class="auth-card"><h1>Reset your password</h1><p class="muted">Enter your account email. If an eligible account exists, we’ll send a secure reset link.</p><form method="post">{% csrf_token %}<input type="hidden" name="request_id" value="{{ request_id }}"><p><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required></p><button type="submit">Request reset link</button></form><p><a href="/login/">Back to sign in</a></p></section>{% endblock %}
